[build]
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# ── Affiliate short links ──
# over40wellness.com/go/... forwards to the ClickBank hoplink.
# To change where a link goes, edit the "to" line here only. Links are listed in
# products/sleep-revive/Affiliate links.md. 302 = temporary, so browsers don't cache it forever.

# Sleep Revive — website review (seller's text page)
[[redirects]]
  from = "/go/sleep-revive"
  to = "https://cb135axo80txpqdkm7ujw4we8u.hop.clickbank.net/?tid=blog&w=transcript"
  status = 302
  force = true

